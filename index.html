<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שאלון אנטומיה – מערכות הגוף</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8EBDD;--paper:#F7F8F1;--olive:#4B5A2C;--olive-2:#6E7F45;--ink:#1E2316;--muted:#5C6450;--red:#B3261E;--ok:#2F6B3A;--line:#C9CFB5;--okbg:rgba(47,107,58,.14);--nobg:rgba(179,38,30,.12)}
@media (prefers-color-scheme: dark){:root{--bg:#161A10;--paper:#21271A;--olive:#A9BC74;--olive-2:#8B9C5A;--ink:#EEF1E4;--muted:#AAB29A;--red:#F07167;--ok:#7CC489;--line:#3A4230;--okbg:rgba(124,196,137,.16);--nobg:rgba(240,113,103,.14)}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Assistant","Arial Hebrew",Arial,sans-serif;font-size:18px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.cross{width:40px;height:40px;flex:none;background:var(--red);-webkit-clip-path:polygon(35% 0,65% 0,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0 65%,0 35%,35% 35%);clip-path:polygon(35% 0,65% 0,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0 65%,0 35%,35% 35%)}
h1{font-family:"Secular One","Assistant",sans-serif;font-weight:400;font-size:1.6rem;line-height:1.15;margin:0}
.sub{color:var(--muted);font-size:.95rem;margin:2px 0 0}
button,select{touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.08)}
button:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
select{width:100%;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:600 1rem "Assistant",sans-serif;margin-bottom:12px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--olive-2);transition:width .3s}
.sec{display:inline-block;font-size:.8rem;font-weight:700;color:var(--olive);border:1px solid var(--olive);border-radius:20px;padding:1px 10px;margin-bottom:8px}
.q{font-family:"Secular One","Assistant",sans-serif;font-size:1.3rem;line-height:1.3;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{text-align:right;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:12px 14px;font:600 1rem "Assistant",sans-serif;cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--red);background:var(--nobg)}
.opt:disabled{cursor:default;opacity:1;color:var(--ink)}
.exp{margin-top:14px;padding:12px;border-right:4px solid var(--olive-2);background:var(--bg);border-radius:6px;font-size:.98rem}
.ok{color:var(--ok)}.no{color:var(--red)}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:10px;padding:13px;font:700 1rem "Assistant",sans-serif;cursor:pointer;background:var(--olive);color:var(--paper)}
.score{font-family:"Secular One","Assistant",sans-serif;font-size:3.4rem;line-height:1;color:var(--olive);margin:6px 0}
.miss{margin:12px 0 0;padding:0;list-style:none}
.miss li{padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}
#err{display:none;background:#B3261E;color:#fff;padding:10px;border-radius:8px;margin-bottom:12px;font-size:.85rem;direction:ltr;text-align:left}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:18px}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div id="err"></div>
  <header><div class="cross" aria-hidden="true"></div><div><h1>שאלון אנטומיה</h1><p class="sub">מערכת ההובלה, העצבים והנשימה</p></div></header>
  <section id="quiz" class="panel" aria-live="polite"><p>טוען…</p></section>
  <footer>עזר לימוד בלבד. חומר הקורס והנחיות המדריכים הם הקובעים.</footer>
</div>
<script>
window.onerror=function(m,s,l){var e=document.getElementById("err");e.style.display="block";e.textContent="Error: "+m+" (line "+l+")";};
var H="מערכת ההובלה",N="מערכת העצבים",R="מערכת הנשימה";
var DATA=[
[H,"לאן חוזר הדם העשיר בחמצן בסוף מחזור הדם הקטן?",["עלייה שמאלית","עלייה ימנית","חדר ימין","אבי העורקים"],"אחרי שחלוף הגזים בריאות, הדם זורם בוורידי הריאה וחוזר לעלייה השמאלית."],
[H,"מה תפקיד מחזור הדם הקטן?",["להעביר דם דל בחמצן לריאות, שם הוא קולט חמצן ופולט פד״ח","לספק חמצן וחומרי הזנה לרקמות הגוף","להחזיר דם מהרגליים ללב","לייצר כדוריות דם אדומות"],"אספקת חמצן לרקמות היא תפקיד מחזור הדם הגדול."],
[H,"לאיזה כלי דם זורם הדם מחדר שמאל?",["אבי העורקים","עורק הריאה","וריד הריאה","הנבוב העליון"],"מחדר שמאל הדם יוצא לאבי העורקים ומשם לכל הגוף."],
[H,"מה סדר כלי הדם במחזור הדם הגדול?",["עורקים ← עורקיקים ← נימים ← ורידונים ← ורידים","עורקים ← נימים ← עורקיקים ← ורידים ← ורידונים","ורידים ← ורידונים ← נימים ← עורקיקים ← עורקים","עורקיקים ← עורקים ← נימים ← ורידים ← ורידונים"],"מהגדול לקטן עד הנימים, ומשם שוב מהקטן לגדול בדרך חזרה ללב."],
[H,"דרך אילו כלי דם נכנס הדם מהגוף לעלייה הימנית?",["הנבובים העליון והתחתון","ורידי הריאה","אבי העורקים","עורקי הריאה"],"הוורידים מתחברים לנבובים, ושניהם נכנסים לעלייה הימנית."],
[H,"מה זה נים?",["כלי הדם הקטן ביותר, שבו מתבצע שחלוף הגזים","כלי דם שמוביל דם עשיר בחמצן מהלב","כלי דם שמחזיר דם דל בחמצן ללב","שסתום בתוך הווריד"],"עורק מוביל מהלב, וריד מחזיר ללב, ובנים מתבצע השחלוף."],
[H,"היכן נוצרות רוב כדוריות הדם האדומות?",["במח העצם","בכבד","בטחול","בלב"],"רוב כדוריות הדם האדומות נוצרות במח העצם."],
[H,"בעזרת מה כדוריות הדם האדומות מובילות חמצן?",["המוגלובין","טסיות דם","אדרנלין","נוזל CSF"],"ההמוגלובין קושר את החמצן בריאות ומשחרר אותו ברקמות."],
[H,"מה תפקיד טסיות הדם?",["השתתפות בתהליך קרישת הדם","הובלת חמצן","השתתפות במערכת החיסון","הובלת פד״ח"],"אדומות מובילות חמצן, לבנות משתתפות בחיסון, טסיות בקרישה."],
[H,"מה עוזר להחזיר ללב את הדם שזורם בוורידים?",["כיווץ שרירי הרגליים ושסתומים בוורידים שמונעים זרימה לאחור","רק כוח הכבידה","התכווצות הסרעפת בלבד","טסיות הדם שדוחפות את הדם"],"השרירים לוחצים על הוורידים, והשסתומים מונעים מהדם לחזור אחורה."],
[N,"מה תפקיד מחסום דם-מוח (BBB)?",["לאפשר מעבר רק של חומרים חיוניים למוח ולהגביל כניסת חומרים מזיקים","לייצר את נוזל ה-CSF","להגן על המוח ממכות חיצוניות","לווסת את קצב הלב"],"ה-BBB הוא מחסום בררני בין הדם לרקמת המוח."],
[N,"מכמה שכבות בנויים קרומי המוח?",["שלוש","אחת","שתיים","ארבע"],"שלוש שכבות שעוטפות את המוח ואת חוט השדרה."],
[N,"מה תפקיד נוזל ה-CSF?",["להגן על מערכת העצבים המרכזית, לרכך זעזועים ולשמור על סביבה יציבה","להוביל חמצן למוח","להעביר אותות עצביים לשרירים","לייצר כדוריות דם לבנות"],"ה-CSF הוא נוזל שקוף שמקיף את המוח ואת עמוד השדרה."],
[N,"מה הסדר בתגובת רפלקס?",["גירוי ← קליטה ← תגובה ← עיבוד","גירוי ← קליטה ← עיבוד ← תגובה","קליטה ← גירוי ← תגובה ← עיבוד","גירוי ← עיבוד ← קליטה ← תגובה"],"ברפלקס התגובה קורית לפני העיבוד. בתגובה עצבית רגילה העיבוד בא קודם."],
[N,"מה מהבאים קורה כשהמערכת הסימפתטית פועלת?",["הרחבת אישונים","כיווץ אישונים","ירידה בקצב הלב","עלייה בתנועתיות מערכת העיכול"],"הסימפתטית מכינה לפעולה: דופק עולה, סמפונות ואישונים מתרחבים, אדרנלין מופרש."],
[N,"מה מהבאים קורה כשהמערכת הפראסימפתטית פועלת?",["ירידה בקצב הלב","הרחבת הסמפונות","הפרשת אדרנלין לדם","שחרור סוכרים לדם"],"הפראסימפתטית מרגיעה: דופק יורד, אישונים מתכווצים, העיכול מתגבר."],
[N,"ויסות קצב הלב ולחץ הדם הוא דוגמה ל:",["ויסות פעולות לא רצוניות","תפקודים גבוהים","הפעלת תגובה מוטורית","רפלקס"],"תפקודים גבוהים הם חשיבה, זיכרון, רגשות ולמידה."],
[R,"מה קורה בשלב השאיפה?",["הסרעפת מתכווצת ויורדת, נפח בית החזה גדל והלחץ בו יורד","הסרעפת נרפית ועולה, ונפח בית החזה קטן","הסרעפת מתכווצת ועולה, והלחץ בבית החזה עולה","הסרעפת לא משתתפת בשאיפה"],"הלחץ הנמוך בבית החזה גורם לאוויר להיכנס לריאות. בנשיפה קורה ההפך."],
[R,"מהו מסלול האוויר בשאיפה?",["אף/פה ← סחוסי הגרון ← קנה הנשימה ← סמפונות ← ריאות ← נאדיות","אף/פה ← קנה הנשימה ← סחוסי הגרון ← נאדיות ← סמפונות","נאדיות ← ריאות ← סמפונות ← קנה הנשימה ← אף/פה","אף/פה ← סמפונות ← קנה הנשימה ← ריאות ← נאדיות"],"המסלול ההפוך, מהנאדיות החוצה, הוא מסלול הנשיפה."],
[R,"איזה סחוס מונע ממזון ומים להיכנס לקנה הנשימה?",["אפיגלוטיס","תירואיד","קריקואיד","סטרנום"],"התירואיד מגן על מיתרי הקול, ומהקריקואיד מתחיל קנה הנשימה."],
[R,"מאיזה סחוס מתחיל קנה הנשימה?",["קריקואיד (סחוס הטבעת)","תירואיד","אפיגלוטיס","אף אחד מהם"],"הקריקואיד נמצא מתחת לתירואיד, וממנו מתחיל קנה הנשימה."],
[R,"מה מהבאים הוא הגנה מזיהומים ולא הגנה גרמית?",["שיעול","כלוב הצלעות","עצם הסטרנום","עצמות הפנים"],"הגנה מזיהומים: שערות האף, ריר וריסים, שיעול ובלוטות לימפה."],
[H,"מה תפקיד כדוריות הדם הלבנות?",["השתתפות במערכת החיסון של הגוף","השתתפות בתהליך קרישת הדם","הובלת חמצן מהריאות לרקמות","הובלת פד״ח מהרקמות לריאות"],"אדומות מובילות חמצן, טסיות משתתפות בקרישה, לבנות משתתפות בחיסון."],
[H,"איזה כלי דם מוביל את הדם מחדר ימין לריאות?",["עורקי הריאה","ורידי הריאה","אבי העורקים","הנבוב התחתון"],"עורק תמיד יוצא מהלב. זה המקרה היחיד שבו עורק מוביל דם דל בחמצן."],
[H,"היכן מתבצע שחלוף החומרים במחזור הדם הגדול?",["בנימים שברקמות","באבי העורקים","בעלייה השמאלית","בוורידים הגדולים"],"בנימים חמצן וחומרי הזנה יוצאים לרקמות, ופד״ח נאסף לתוך הוורידונים."],
[H,"מה מהבאים אינו תפקיד של מחזור הדם הגדול?",["לקלוט חמצן בריאות","לספק חמצן לרקמות הגוף","לספק חומרי הזנה לרקמות","להחזיר ללב דם דל בחמצן"],"קליטת חמצן בריאות היא תפקיד מחזור הדם הקטן."],
[H,"לאן זורם הדם מהעלייה השמאלית?",["לחדר שמאל","לחדר ימין","לעורקי הריאה","לנבוב העליון"],"עלייה שמאלית ← חדר שמאל ← אבי העורקים ← כל הגוף."],
[H,"מה תפקיד השסתומים שבתוך הוורידים?",["למנוע מהדם לזרום לאחור","לדחוף את הדם קדימה","לסנן חומרים מזיקים מהדם","לבצע שחלוף גזים"],"את הדחיפה עושים שרירי הרגליים, והשסתומים מונעים מהדם לחזור אחורה."],
[H,"מה מבדיל בין עורק לווריד?",["עורק מוביל דם מהלב לרקמות, וריד מחזיר דם מהגוף ללב","עורק מחזיר דם ללב, וריד מוביל דם מהלב","בעורק מתבצע שחלוף הגזים, בווריד לא","אין הבדל, אלה שמות שונים לאותו כלי דם"],"עורק – מהלב החוצה. וריד – חזרה ללב. השחלוף מתבצע בנימים."],
[N,"חייל נוגע במשטח חם ומזיז את היד עוד לפני שהבין מה קרה. מה זה?",["רפלקס","תגובה עצבית רגילה","תפקוד גבוה","פעולה של המערכת הפראסימפתטית"],"ברפלקס התגובה מגיעה לפני העיבוד: גירוי ← קליטה ← תגובה ← עיבוד."],
[N,"זיכרון, רגשות ולמידה שייכים לאיזה תפקיד של מערכת העצבים?",["תפקודים גבוהים","קליטת מידע","ויסות פעולות לא רצוניות","הפעלת תגובות מוטוריות"],"תפקודים גבוהים: חשיבה, זיכרון, רגשות ולמידה."],
[N,"איזו מהדוגמאות היא קליטת מידע?",["זיהוי רמת החמצן בדם","הרמת יד","ויסות לחץ הדם","זכירת פרוטוקול"],"מערכת העצבים קולטת כאב, חום, לחץ דם, רמת חמצן ומגע. הרמת יד היא תגובה מוטורית."],
[N,"מה מהבאים אינו מנגנון הגנה של המוח?",["האפיגלוטיס","עצמות הגולגולת","קרומי המוח","מחסום דם-מוח (BBB)"],"האפיגלוטיס הוא סחוס בגרון. הגנות המוח: שיער וגולגולת, קרומי המוח, CSF ו-BBB."],
[N,"לפצוע יש דופק מהיר ואישונים רחבים. איזו מערכת פעילה?",["הסימפתטית","הפראסימפתטית","מערכת החיסון","שתיהן באותה מידה"],"הסימפתטית: דופק עולה, סמפונות ואישונים מתרחבים, אדרנלין וסוכרים משתחררים לדם."],
[N,"מה קורה לשלפוחית השתן כשהמערכת הסימפתטית פועלת?",["נטייה לעיכוב התרוקנות השלפוחית","הקלה על מתן שתן","אין השפעה","הגברת ייצור שתן"],"הקלה על מתן שתן היא פעולה של הפראסימפתטית."],
[R,"מה קורה בשלב הנשיפה?",["הסרעפת נרפית ועולה, והלחץ בריאות עולה ביחס ללחץ האטמוספרי","הסרעפת מתכווצת ויורדת, ונפח בית החזה גדל","הסרעפת נרפית ויורדת, והלחץ בריאות יורד","הלחץ בריאות שווה ללחץ האטמוספרי"],"נפח בית החזה קטן, הלחץ בריאות עולה, והאוויר יוצא החוצה."],
[R,"היכן מתחיל מסלול האוויר בנשיפה?",["בנאדיות","באף/פה","בסחוסי הגרון","בקנה הנשימה"],"נשיפה: נאדיות ← ריאות ← סמפונות ← קנה הנשימה ← סחוסי הגרון ← אף/פה."],
[R,"איזה סחוס מגן על מיתרי הקול?",["תירואיד","אפיגלוטיס","קריקואיד","סטרנום"],"אפיגלוטיס מונע כניסת מזון לקנה, תירואיד מגן על מיתרי הקול, ומהקריקואיד מתחיל קנה הנשימה."],
[R,"איזה מהבאים הוא הגנה גרמית של מערכת הנשימה?",["כלוב הצלעות","ריר וריסים","בלוטות הלימפה","שערות האף"],"הגנה גרמית: עצמות הפנים, כלוב הצלעות ועצם הסטרנום. השאר הן הגנות מזיהומים."]
];
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var Q=document.getElementById("quiz"),SECS=["כל השאלות",H,N,R],sec=SECS[0],qs=[],qi=0,score=0,missed=[];
function newRound(){var pool=sec===SECS[0]?DATA:DATA.filter(function(d){return d[0]===sec;});
 qs=shuffle(pool).map(function(d){var o=shuffle(d[2]);return{s:d[0],q:d[1],o:o,a:o.indexOf(d[2][0]),c:d[2][0],e:d[3]};});
 qi=0;score=0;missed=[];renderQ();}
function renderQ(){if(qi>=qs.length)return renderEnd();var c=qs[qi],opts="";
 for(var k=0;k<SECS.length;k++)opts+='<option'+(SECS[k]===sec?" selected":"")+'>'+SECS[k]+'</option>';
 var h=(qi===0?'<select id="sec" aria-label="בחירת נושא">'+opts+'</select>':'')+'<div class="meta"><span>שאלה '+(qi+1)+' מתוך '+qs.length+'</span><span>'+score+' נכונות</span></div><div class="bar"><i style="width:'+(qi/qs.length*100)+'%"></i></div><span class="sec">'+esc(c.s)+'</span><p class="q">'+esc(c.q)+'</p><div class="opts">';
 for(var i=0;i<c.o.length;i++)h+='<button type="button" class="opt" data-i="'+i+'">'+esc(c.o[i])+'</button>';
 Q.innerHTML=h+'</div><div id="after"></div>';}
function answer(i){var c=qs[qi],btns=Q.querySelectorAll(".opt");if(btns[0].disabled)return;
 for(var k=0;k<btns.length;k++)btns[k].disabled=true;btns[c.a].className+=" right";var ok=i===c.a;
 if(ok)score++;else{btns[i].className+=" wrong";missed.push(c);}
 document.getElementById("after").innerHTML='<div class="exp"><b class="'+(ok?"ok":"no")+'">'+(ok?"נכון.":"לא נכון. התשובה: "+esc(c.c)+".")+'</b> '+esc(c.e)+'</div><div class="actions"><button type="button" class="btn" data-act="next">'+(qi+1<qs.length?"לשאלה הבאה":"לסיכום")+'</button></div>';}
function renderEnd(){var h='<p class="sub">הציון שלך</p><div class="score">'+score+'/'+qs.length+'</div>';
 if(missed.length){h+='<p style="margin:10px 0 0;font-weight:700">כדאי לחזור על:</p><ul class="miss">';for(var i=0;i<missed.length;i++)h+='<li><b>'+esc(missed[i].q)+'</b><br>'+esc(missed[i].c)+'</li>';h+='</ul>';}else h+='<p>מושלם. כל התשובות נכונות.</p>';
 Q.innerHTML=h+'<div class="actions"><button type="button" class="btn" data-act="again">סבב חדש</button></div>';}
Q.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 if(b.classList.contains("opt"))answer(+b.getAttribute("data-i"));
 else if(b.getAttribute("data-act")==="next"){qi++;renderQ();window.scrollTo(0,0);}
 else if(b.getAttribute("data-act")==="again")newRound();});
Q.addEventListener("change",function(e){if(e.target.id==="sec"){sec=e.target.value;newRound();}});
newRound();
</script>
</body>
</html>
